<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0a4d4e">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Med Sense - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a2e30;--pine:#0a4d4e;--teal:#0f8a82;--teal-hover:#0b6f69;--mint:#7ff0d0;--mist:#eaf6f3;--paper:#f6fbfa;--line:#d3e5e1;--muted:#587571;--amber:#f5a524;--amber-bg:#fff6e0;--font-display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;--font-body:"Manrope","Segoe UI",Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;padding:28px 16px;font-family:var(--font-body);color:var(--ink);line-height:1.55;background:radial-gradient(900px 500px at 8% -10%,#c9f1e6 0%,transparent 60%),radial-gradient(800px 500px at 100% 0%,#dcdcff 0%,transparent 55%),#eef6f4}
input,button{font:inherit}
a{color:var(--teal)}
.container{width:1100px;max-width:100%;margin:auto;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(10,77,78,.35)}
.hero{position:relative;display:flex;align-items:center;gap:22px;padding:44px 40px 70px;color:#fff;background:linear-gradient(120deg,#062a33 0%,#0a4d4e 55%,#0f8a82 100%);overflow:hidden}
.mark{flex:none;width:74px;height:74px;display:grid;place-items:center;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28)}
.mark svg{width:38px;height:38px}
.hero-text{position:relative;z-index:1}
h1{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.02em;color:#fff}
.subtitle{margin-top:8px;max-width:48ch;color:#c9ece6;font-size:16px}
.pulse{position:absolute;left:0;right:0;bottom:0;width:100%;height:70px;pointer-events:none}
.pulse-line{fill:none;stroke:var(--mint);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(127,240,208,.7));animation:draw 2.4s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.pulse-line{animation:none;stroke-dashoffset:0}}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 40px;border-bottom:1px solid var(--line);background:var(--paper)}
nav a{text-decoration:none;font-weight:700;font-size:14px;color:var(--pine);padding:8px 16px;border-radius:99px}
nav a:hover{background:var(--mist)}nav a.on{background:var(--teal);color:#fff}
nav a.out{margin-left:auto;border:1.5px solid var(--teal)}
.main{padding:34px 40px 40px}
h2{font-family:var(--font-display);font-size:26px;color:var(--pine);margin:0 0 6px}
h3{font-family:var(--font-display);font-size:19px;color:var(--pine)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--mist);border-radius:18px;padding:16px 20px}
.stat b{display:block;font-family:var(--font-display);font-size:34px;color:var(--teal)}
.stat span{color:var(--muted);font-weight:600;font-size:14px}
input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:16px;color:var(--ink);background:var(--paper)}
input:focus,a:focus-visible,button:focus-visible{outline:3px solid rgba(15,138,130,.35);border-color:var(--teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--pine);font-weight:600;font-size:13px;padding:6px 14px;border-radius:99px;cursor:pointer}
.chip.on,.chip:hover{background:var(--pine);border-color:var(--pine);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px}
.card:hover{border-color:var(--teal);box-shadow:0 10px 24px -14px rgba(10,77,78,.5)}
.card small{display:inline-block;background:var(--mist);color:var(--pine);font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px;margin-bottom:8px}
.card p{color:var(--muted);font-size:14px;margin-top:4px}
.lead{color:var(--muted);margin-bottom:16px}
.back{display:inline-block;margin-bottom:16px;font-weight:700;text-decoration:none}
.box{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:18px 22px;margin-top:16px}
.box h3{margin-bottom:6px}
.box.warn{background:var(--amber-bg);border-color:var(--amber)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 16px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tags a{text-decoration:none;background:#fff;border:1.5px solid var(--line);color:var(--pine);font-weight:600;font-size:14px;padding:6px 14px;border-radius:99px}
.tags a:hover{border-color:var(--teal);background:var(--mist)}
.btn{display:inline-block;margin-top:18px;text-decoration:none;background:var(--teal);color:#fff;font-weight:700;padding:12px 22px;border-radius:14px}
.btn:hover{background:var(--teal-hover)}
.note{font-size:13px;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:14px}

.audience-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0 24px}
.audience-card{display:block;text-decoration:none;color:var(--ink);background:var(--mist);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.audience-card:hover{border-color:var(--teal)}
.audience-card h3{font-family:var(--font-display);font-size:16px;color:var(--pine);margin:4px 0}
.audience-card p{font-size:12px;color:var(--muted);margin:0}
.feedback-fab{position:fixed;left:16px;bottom:16px;z-index:50;background:var(--amber);color:#1a1200;font-weight:700;font-size:14px;padding:12px 18px;border-radius:99px;border:0;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:24px}
.modal h3{font-family:var(--font-display);color:var(--pine);margin-bottom:8px}
.stars{display:flex;gap:8px;margin:12px 0 16px}
.stars button{background:none;border:0;font-size:28px;cursor:pointer;opacity:.35}
.stars button.on{opacity:1}
.modal textarea{width:100%;min-height:80px;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;margin-bottom:12px}
.modal .row{display:flex;gap:10px;justify-content:flex-end}


.caution{margin:12px 0 16px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600}
.caution-preg{background:#fce4ec;border:1.5px solid #ec407a;color:#880e4f}
.caution-vet{background:#fff3e0;border:1.5px solid #ff9800;color:#e65100}
.seek-box{margin:16px 0;padding:16px 18px;background:#e8f4ff;border-left:5px solid #1976d2;border-radius:14px}
.seek-box h3{color:#0d47a1;margin:0 0 6px;font-family:var(--font-display);font-size:16px}
.source-note{font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}


.subtitle strong{display:inline-block;font-family:var(--font-display);font-weight:800;color:#7ff0d0}
.disclaimer-top{margin:0 0 20px;padding:14px 16px;background:var(--amber-bg);border:1.5px solid var(--amber);border-left-width:6px;border-radius:14px;font-size:14px;line-height:1.5}
.search-top{margin:0 0 16px}
.search-top input{width:100%;padding:14px 16px;border:2px solid var(--teal);border-radius:14px;font-size:16px;background:var(--paper)}

@media(max-width:700px){.hero{padding:32px 22px 64px}h1{font-size:34px}.main{padding:26px 20px}nav{padding:12px 20px}.stats{grid-template-columns:1fr}nav a.out{margin-left:0}}
</style>
<script src="js/install.js"></script>
</head>
<body>
<div class="container">
<header class="hero">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#7ff0d0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></div>
  <div class="hero-text"><h1>Med Sense</h1><p class="subtitle"><strong>Educate medicines in one stop</strong> — clear, practical information on diseases and common medicines</p></div>
  <svg class="pulse" viewBox="0 0 600 70" preserveAspectRatio="none" aria-hidden="true"><path class="pulse-line" pathLength="1" vector-effect="non-scaling-stroke" d="M0 40 H190 L212 40 L228 14 L248 62 L268 6 L286 40 H600"/></svg>
</header>
<nav id="nav"></nav>
<div class="main" id="app"><p class="lead">Loading...</p></div>
</div>
<script>
const API_BASE="";
let D={},M={},cat="All",q="";
const app=document.getElementById("app"),nav=document.getElementById("nav");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc=encodeURIComponent;
const NOTE='<p class="note">Educational information only. It does not diagnose disease or prescribe medication. Always check the package label and consult a doctor or pharmacist.</p>';
function bar(on){nav.innerHTML='<a href="#home" class="'+(on==="home"?"on":"")+'">Diseases</a><a href="#medicines" class="'+(on==="med"?"on":"")+'">Medicines</a><a class="out" href="/">Open Checker</a>'}
function home(){
  bar("home");
  const cats=["All",...new Set(Object.values(D).map(d=>d.category))].sort((a,b)=>a==="All"?-1:b==="All"?1:a.localeCompare(b));
  const audiences=[
    {id:"Child Care",title:"Child Care",desc:"Paediatric fever, colds, diarrhoea",icon:"🧒"},
    {id:"Aged Care",title:"Aged People",desc:"Joints, BP, sleep, UTIs",icon:"👴"},
    {id:"Pregnancy",title:"Pregnant Women",desc:"Nausea, anaemia, heartburn",icon:"🤰"},
    {id:"Veterinary",title:"Animals / Vet",desc:"Fleas, worms, pet care",icon:"🐾"}
  ];
  const DISCLAIMER='<div class="disclaimer-top" role="note"><strong>Educational information only.</strong> Med Sense does not diagnose disease, prescribe medication, or replace advice from a qualified doctor or pharmacist. Always read the product label and follow professional guidance — especially for children, older adults, pregnancy, and animals.</div>';
  app.innerHTML=DISCLAIMER+
  '<div class="search-top"><input id="q" type="search" placeholder="Search diseases, symptoms or medicines" aria-label="Search" value="'+esc(q)+'"></div>'+
  '<div class="stats"><div class="stat"><b>'+Object.keys(D).length+'</b><span>Diseases</span></div><div class="stat"><b>'+Object.keys(M).length+'</b><span>Medicines</span></div><div class="stat"><b>'+(cats.length-1)+'</b><span>Categories</span></div></div>'+
  '<h2 style="margin-top:6px">Browse by audience</h2><p class="lead">Child care, aged people, pregnancy and veterinary sections are open with filled data.</p>'+
  '<div class="audience-grid">'+audiences.map(a=>'<a class="audience-card" href="#home" data-aud="'+esc(a.id)+'"><div style="font-size:26px">'+a.icon+'</div><h3>'+esc(a.title)+'</h3><p>'+esc(a.desc)+'</p></a>').join("")+'</div>'+
  '<div class="chips" id="chips"></div><div class="grid" id="g"></div>'+NOTE;
  const draw=()=>{
    document.getElementById("chips").innerHTML=cats.map(c=>'<button class="chip '+(c===cat?"on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
    const s=q.toLowerCase();
    const list=Object.entries(D).filter(([n,d])=>(cat==="All"||d.category===cat)&&(!s||(n+d.symptoms+d.medicines.join(" ")).toLowerCase().includes(s)));
    document.getElementById("g").innerHTML=list.map(([n,d])=>'<a class="card" href="#d/'+enc(n)+'"><small>'+esc(d.category)+'</small><h3>'+esc(n)+'</h3><p>'+esc(d.symptoms.slice(0,80))+(d.symptoms.length>80?"...":"")+'</p></a>').join("")||'<p class="lead">No match. Try another word or clear the category.</p>';
  };
  draw();
  document.getElementById("q").oninput=e=>{q=e.target.value.trim();draw()};
  document.getElementById("chips").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;draw()}};
  const ag=document.querySelector(".audience-grid");
  if(ag)ag.onclick=e=>{const a=e.target.closest("[data-aud]");if(a){cat=a.dataset.aud;q="";document.getElementById("q").value="";draw()}};
}
function disease(n){
  const d=D[n];if(!d)return home();
  bar("home");
  app.innerHTML='<a class="back" href="#home">Back to diseases</a><span class="tags"><a href="#home" style="pointer-events:none">'+esc(d.category)+'</a></span><h2 style="margin-top:10px">'+esc(n)+'</h2>'+
  '<div class="box"><h3>Common symptoms</h3><p>'+esc(d.symptoms)+'</p></div>'+
  '<div class="box"><h3>Medicines commonly listed ('+d.medicines.length+')</h3><div class="tags">'+d.medicines.map(m=>M[m]?'<a href="#m/'+enc(m)+'">'+esc(m)+'</a>':'<a href="#home" style="pointer-events:none">'+esc(m)+'</a>').join("")+'</div></div>'+
  '<a class="btn" href="/">Check a medicine for '+esc(n)+'</a>'+NOTE;
  scrollTo(0,0);
}
function meds(){
  bar("med");
  app.innerHTML='<h2>All medicines</h2><p class="lead">Tap a medicine for uses, precautions and side effects.</p><input id="mq" type="search" placeholder="Search medicines or purpose" aria-label="Search medicines"><div class="grid" id="g" style="margin-top:18px"></div>'+NOTE;
  const draw=s=>{document.getElementById("g").innerHTML=Object.entries(M).filter(([n,m])=>(n+m.purpose+m.ingredient).toLowerCase().includes(s)).sort().map(([n,m])=>'<a class="card" href="#m/'+enc(n)+'"><small>'+esc(m.form)+'</small><h3>'+esc(n)+'</h3><p>'+esc(m.purpose)+'</p></a>').join("")||'<p class="lead">No match.</p>'};
  draw("");document.getElementById("mq").oninput=e=>draw(e.target.value.trim().toLowerCase());
}
function medicine(n){
  const m=M[n];if(!m)return meds();
  bar("med");
  const used=Object.entries(D).filter(([k,d])=>d.medicines.includes(n)).map(([k])=>k);
  const F=[["Uses","uses"],["Age guidance","age"],["Precautions","precautions"],["Side effects","sideEffects"],["Interactions","interactions"],["With food","food"],["Availability","status"]];
  app.innerHTML='<a class="back" href="#medicines">Back to medicines</a><h2>'+esc(n)+'</h2><p class="lead">'+esc(m.form)+' &middot; '+esc(m.ingredient)+'</p>'+
  '<div class="box"><h3>Purpose</h3><p>'+esc(m.purpose)+'</p></div>'+
  '<div class="facts">'+F.map(([t,k])=>'<div class="box"><h3>'+t+'</h3><p>'+esc(m[k])+'</p></div>').join("")+'</div>'+
  (m.warning?'<div class="box warn"><h3>Warning</h3><p>'+esc(m.warning)+'</p></div>':'')+
  (used.length?'<div class="box"><h3>Listed for these conditions</h3><div class="tags">'+used.map(k=>'<a href="#d/'+enc(k)+'">'+esc(k)+'</a>').join("")+'</div></div>':'')+NOTE;
  scrollTo(0,0);
}
function route(){
  const h=location.hash.slice(1),i=h.indexOf("/"),k=i<0?h:h.slice(0,i),v=i<0?"":decodeURIComponent(h.slice(i+1));
  if(k==="d")disease(v);else if(k==="m")medicine(v);else if(k==="medicines")meds();else home();
}
Promise.all([fetch(API_BASE+"/api/diseases-all").then(r=>r.json()),fetch(API_BASE+"/api/medicines-all").then(r=>r.json())])
 .then(([d,m])=>{D=d;M=m;route();addEventListener("hashchange",route)})
 .catch(()=>{app.innerHTML='<p class="lead">Could not load data. Start the server with <b>npm start</b> and open this page from the same address.</p>'});

(function(){
  if(document.getElementById("feedback-fab"))return;
  const fab=document.createElement("button");
  fab.id="feedback-fab";fab.className="feedback-fab";fab.type="button";fab.textContent="Rate & Suggest";
  document.body.appendChild(fab);
  let rating=0;
  fab.onclick=function(){
    if(document.getElementById("fb-backdrop"))return;
    const bd=document.createElement("div");bd.id="fb-backdrop";bd.className="modal-backdrop";
    bd.innerHTML='<div class="modal"><h3>Rate Med Sense & share ideas</h3><p class="lead">How useful is the site?</p><div class="stars" id="fb-stars">'+[1,2,3,4,5].map(n=>'<button type="button" data-r="'+n+'">★</button>').join("")+'</div><textarea id="fb-idea" placeholder="Your suggestions..."></textarea><div class="row"><button type="button" class="btn" id="fb-cancel" style="background:transparent;color:var(--teal);border:1.5px solid var(--teal)">Cancel</button><button type="button" class="btn" id="fb-send">Send</button></div></div>';
    document.body.appendChild(bd);
    const stars=bd.querySelectorAll("#fb-stars button");
    stars.forEach(b=>b.onclick=()=>{rating=+b.dataset.r;stars.forEach(s=>s.classList.toggle("on",+s.dataset.r<=rating))});
    bd.querySelector("#fb-cancel").onclick=()=>bd.remove();
    bd.onclick=e=>{if(e.target===bd)bd.remove()};
    bd.querySelector("#fb-send").onclick=()=>{
      const idea=(document.getElementById("fb-idea").value||"").trim();
      if(!rating&&!idea){alert("Please rate or write a suggestion.");return}
      try{const list=JSON.parse(localStorage.getItem("ms_feedback")||"[]");list.push({rating,idea,at:new Date().toISOString()});localStorage.setItem("ms_feedback",JSON.stringify(list))}catch(e){}
      bd.innerHTML='<div class="modal"><h3>Thank you!</h3><p class="lead">Your feedback helps improve Med Sense.</p><div class="row"><button type="button" class="btn" id="fb-ok">Close</button></div></div>';
      bd.querySelector("#fb-ok").onclick=()=>bd.remove();
    };
  };
})();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
